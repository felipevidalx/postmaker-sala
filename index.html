<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f6f9">
<title>Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: uma coluna sobre fundo branco gelo. Em cima, as carinhas dos agentes; no centro, o bonequinho (tocar = falar);
   embaixo dele, o que você disse e o retorno do agente; depois, a conversa inteira. */
:root {
  --gelo: #f3f6f9;
  --gelo-2: #e8eef3;
  --gelo-3: #d7e1e9;
  --neve: #ffffff;
  --tinta: #1f2a33;
  --tinta-2: #5d6d7a;
  --azul: #3e7cb1;
  --vermelho: #c2452d;
  --display: "Fraunces", Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: radial-gradient(120% 70% at 50% 0%, var(--neve) 0%, var(--gelo) 55%, var(--gelo-2) 100%) fixed;
  color: var(--tinta); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(1rem, env(safe-area-inset-top, 0px)) max(2rem, env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
.coluna { max-width: 40rem; margin: 0 auto; display: grid; gap: 1.25rem; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
.dica { font-size: 0.88rem; color: var(--tinta-2); }
.erro { color: var(--vermelho); font-weight: 700; font-size: 0.95rem; }
.botao { font-weight: 700; border-radius: 99px; padding: 0.55rem 1.1rem; border: 1px solid var(--gelo-3); background: var(--neve); }
.botao.principal { background: var(--tinta); color: var(--neve); border-color: var(--tinta); }

/* entrada */
.entrada { min-height: 80vh; display: grid; place-items: center; }
.entrada form { display: grid; gap: 0.9rem; width: 100%; max-width: 21rem; text-align: center; justify-items: center; }
.entrada input { width: 100%; padding: 0.8rem 1rem; border-radius: 14px; border: 1px solid var(--gelo-3); background: var(--neve); text-align: center; }

/* carinhas dos agentes */
.equipe { display: flex; gap: 0.6rem; overflow-x: auto; padding: 0.3rem 0.2rem 0.5rem; scrollbar-width: none; }
.equipe::-webkit-scrollbar { display: none; }
.equipe button { flex: none; border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 0.2rem; width: 4.4rem; color: var(--tinta-2); font-size: 0.7rem; line-height: 1.15; text-align: center; }
.equipe .rosto { width: 3.3rem; height: 3.3rem; border-radius: 50%; background: var(--neve); display: grid; place-items: center; box-shadow: 0 1px 3px rgb(31 42 51 / 0.08); transition: transform .2s; }
.equipe .rosto svg { width: 3.1rem; height: 3.1rem; }
.equipe button[aria-pressed="true"] { color: var(--tinta); font-weight: 700; }
.equipe button[aria-pressed="true"] .rosto { box-shadow: 0 0 0 3px var(--tinta); transform: translateY(-2px); }

/* palco */
.palco { display: grid; justify-items: center; gap: 0.4rem; padding-top: 0.5rem; }
.nome { font-family: var(--display); font-size: 1.5rem; }
.funcao { font-size: 0.9rem; color: var(--tinta-2); text-align: center; max-width: 30rem; }
#boneco { border: 0; background: none; padding: 0; width: min(16rem, 64vw); aspect-ratio: 1; border-radius: 50%; -webkit-tap-highlight-color: transparent; }
#boneco svg { width: 100%; height: 100%; overflow: visible; }
.estado { font-size: 0.92rem; color: var(--tinta-2); min-height: 1.4em; text-align: center; }
.estado b { color: var(--vermelho); }

/* retorno */
.retorno { display: grid; gap: 0.8rem; }
.fala { position: relative; justify-self: center; text-align: center; color: var(--tinta-2); max-width: 34rem; background: var(--neve); border-radius: 18px; padding: 0.7rem 1rem; box-shadow: 0 1px 2px rgb(31 42 51 / 0.06); margin-top: 0.4rem; }
.fala::before { content: ""; position: absolute; top: -7px; left: 50%; width: 14px; height: 14px; background: var(--neve); transform: translateX(-50%) rotate(45deg); }
.fala b { color: var(--tinta); font-weight: 400; }
.fala i { color: var(--tinta-2); }
.fala.ouvindo { box-shadow: 0 0 0 2px var(--vermelho); }
.fala b { font-style: normal; color: var(--tinta); font-weight: 400; }
.cartao { background: var(--neve); border-radius: 20px; padding: 1.1rem 1.2rem; box-shadow: 0 1px 2px rgb(31 42 51 / 0.05), 0 8px 24px -12px rgb(31 42 51 / 0.12); min-width: 0; overflow-wrap: anywhere; }
.cartao > * { margin: 0 0 0.6rem; }
.cartao > *:last-child { margin-bottom: 0; }
.cartao h1, .cartao h2, .cartao h3 { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.cartao ul, .cartao ol { padding-left: 1.2rem; }
.cartao .tabela { overflow-x: auto; }
.cartao table { border-collapse: collapse; font-size: 0.88rem; }
.cartao th, .cartao td { border-bottom: 1px solid var(--gelo-3); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
.cartao a { color: var(--azul); }
.pensando { color: var(--tinta-2); font-style: italic; text-align: center; }

/* ações e conversa */
.acoes { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
.pauta { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; }
.pauta button { font-size: 0.88rem; border-radius: 99px; padding: 0.4rem 0.85rem; border: 1px solid var(--gelo-3); background: rgb(255 255 255 / 0.7); }
.teclado { display: grid; gap: 0.5rem; }
.teclado textarea { width: 100%; min-height: 5rem; resize: vertical; padding: 0.7rem 0.9rem; border-radius: 14px; border: 1px solid var(--gelo-3); background: var(--neve); }
.teclado .acoes { justify-content: flex-end; }
details.bloco { border-top: 1px solid var(--gelo-3); padding-top: 0.8rem; }
details.bloco summary { cursor: pointer; color: var(--tinta-2); font-size: 0.92rem; }
.historico { list-style: none; margin: 0.6rem 0 0; padding: 0; display: grid; gap: 0.1rem; }
.historico button { width: 100%; text-align: left; border: 0; background: none; padding: 0.45rem 0.3rem; border-radius: 10px; display: grid; }
.historico button:hover { background: var(--neve); }
.historico small { color: var(--tinta-2); }
.fio { display: grid; gap: 0.8rem; margin-top: 0.8rem; }
.fio .voce { justify-self: end; background: var(--tinta); color: var(--neve); border-radius: 18px 18px 4px 18px; padding: 0.6rem 0.9rem; max-width: 88%; white-space: pre-wrap; }
.fio .quem { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tinta-2); font-weight: 700; }
</style>
</head>
<body>

<section class="entrada" id="tela-entrada" hidden>
  <form id="form-entrada">
    <div id="boneco-entrada" style="width:8rem;height:8rem"></div>
    <h1>Sala</h1>
    <p class="dica">Converse por voz com a sua Equipe. O PC precisa estar ligado.</p>
    <label for="senha" class="dica">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <p class="erro" id="erro-entrada" role="alert"></p>
    <button class="botao principal" type="submit">Entrar</button>
  </form>
</section>

<main class="coluna" id="app" hidden>
  <nav class="equipe" id="equipe" aria-label="Com quem você quer falar"></nav>

  <section class="palco">
    <p class="nome" id="nome"></p>
    <p class="funcao" id="funcao"></p>
    <button type="button" id="boneco" aria-label="Tocar para falar"></button>
    <p class="fala" id="fala" aria-live="polite" hidden></p>
    <p class="estado" id="estado" aria-live="polite">Toque em mim para falar</p>
  </section>

  <section class="retorno" aria-live="polite">
    <div id="resposta"></div>
  </section>

  <div class="pauta" id="pauta"></div>

  <div class="acoes">
    <button type="button" class="botao" id="btn-teclado">Escrever</button>
    <button type="button" class="botao" id="btn-plano">Fechar o plano</button>
    <button type="button" class="botao" id="nova">Nova conversa</button>
  </div>
  <div class="teclado" id="teclado" hidden>
    <textarea id="texto" aria-label="Sua mensagem" placeholder="Escreva aqui…"></textarea>
    <div class="acoes"><button type="button" class="botao principal" id="enviar-texto">Enviar</button></div>
  </div>

  <details class="bloco" id="bloco-fio" hidden>
    <summary>Conversa inteira</summary>
    <div class="fio" id="fio"></div>
  </details>
  <details class="bloco" id="historico">
    <summary>Conversas anteriores</summary>
    <ul class="historico" id="lista-conversas"></ul>
  </details>
</main>

<script>
const REPO = "felipevidalx/postmaker-sala";
const LOCAL = "sala-postmaker";
const PAUTA = [
  ["A oferta", "Quero pensar a oferta do Foundrs: para quem é, o que entrega, preço e formato. Me ajuda a fechar?"],
  ["Modelo de negócio", "Vamos pensar o modelo de negócio: de onde vem o dinheiro da Akadi e do Foundrs, e quanto custa entregar."],
  ["Projeções", "Faz uma projeção de receita até dezembro e até junho de 2027, em três cenários, com as premissas à vista."],
  ["O que para de pé", "Das ideias que eu tenho hoje, o que para de pé e o que não para? Me pergunta o que precisar."],
  ["O que não dá agora", "O que eu não teria como fazer agora, mesmo sendo uma boa ideia? E o que precisa acontecer antes?"],
  ["Prioridade até dezembro", "Qual deveria ser a minha prioridade até o fim do ano? No máximo 3 coisas, em ordem."],
];
const FECHAR = "Fecha o plano agora, no formato do seu documento-base: oferta, modelo de negócio, projeção nos três cenários, o que para de pé e o que não para, o que não dá para fazer agora e a prioridade até 31 de dezembro.";

/* ================= carinhas ================= */
// Cada agente tem cor e um detalhe próprio. Agente novo sem entrada aqui ganha cor e detalhe pelo nome.
const ROSTOS = {
  "Sócio de Negócios":        { cor: 210, item: "oculos" },
  "Advisor":                  { cor: 30,  item: "advisor", sat: 0.55 },
  "Advisor de Escala":        { cor: 195, item: "escala", sat: 0.6 },
  "Estrategista de Conteúdo": { cor: 260, item: "estrela" },
  "Pesquisadora":             { cor: 175, item: "antena" },
  "Copywriter":               { cor: 25,  item: "topete" },
  "Ghostwriter":              { cor: 285, item: "boina" },
  "Designer":                 { cor: 330, item: "gota" },
  "Editor de Reels":          { cor: 5,   item: "fones" },
  "Revisor de Fatos":         { cor: 140, item: "monoculo" },
  "Social Media":             { cor: 345, item: "coracao" },
  "Community Manager":        { cor: 95,  item: "broto" },
};
const ITENS = ["oculos", "estrela", "antena", "topete", "boina", "gota", "fones", "monoculo", "coracao", "broto"];
function rostoDe(nome) {
  if (ROSTOS[nome]) return ROSTOS[nome];
  let h = 0; for (const c of nome || "") h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return { cor: h % 360, item: ITENS[h % ITENS.length] };
}

function itemSvg(item, cor) {
  const escuro = `hsl(${cor} 35% 30%)`, vivo = `hsl(${cor} 70% 55%)`;
  return {
    estrela: `<path d="M100 18l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="${vivo}"/>`,
    antena: `<path d="M100 40V18" stroke="${escuro}" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="15" r="8" fill="${vivo}"/>`,
    topete: `<path d="M84 42q6-26 22-22-12 6-6 22M98 40q10-22 26-14-14 2-14 16" fill="${vivo}"/>`,
    boina: `<path d="M52 56q48-38 96 0q-48 10-96 0z" fill="${escuro}"/><circle cx="100" cy="30" r="5" fill="${escuro}"/>`,
    gota: `<path d="M100 14q16 20 0 34q-16-14 0-34z" fill="${vivo}"/>`,
    fones: `<g fill="none" stroke="${escuro}" stroke-width="6" stroke-linecap="round"><path d="M42 100q0-66 58-66t58 66"/></g><rect x="30" y="92" width="18" height="30" rx="8" fill="${escuro}"/><rect x="152" y="92" width="18" height="30" rx="8" fill="${escuro}"/>`,
    coracao: `<path d="M100 40V24" stroke="${escuro}" stroke-width="4" stroke-linecap="round"/><path d="M100 24c-4-8-16-6-14 3 1 6 14 12 14 12s13-6 14-12c2-9-10-11-14-3z" fill="${vivo}"/>`,
    advisor: `<path d="M36 92q-10-62 60-66 66-4 72 58-6-10-14-14 0-20-24-26 8 10 2 16-20-20-58-14-30 8-38 46z" fill="hsl(25 35% 20%)"/><path d="M70 40q20-10 44-6" fill="none" stroke="hsl(25 30% 34%)" stroke-width="4" stroke-linecap="round"/>`,
    escala: `<path d="M38 80q-2-50 62-52 62 2 62 52-8-26-28-32 10 10 6 18-16-22-44-20-40 6-58 34z" fill="hsl(220 25% 14%)"/><path d="M80 34q30-10 56 6" fill="none" stroke="hsl(220 20% 32%)" stroke-width="4" stroke-linecap="round"/>`,
    broto: `<path d="M100 40V24" stroke="hsl(120 35% 35%)" stroke-width="4" stroke-linecap="round"/><path d="M100 26q-16-14-24-2 14 6 24 2zM100 26q14-16 24-4-12 8-24 4z" fill="hsl(120 45% 50%)"/>`,
  }[item] || "";
}

// Itens presos ao rosto: andam junto com os olhos quando o bonequinho olha para o cursor.
function itemRostoSvg(item, cor) {
  const escuro = `hsl(${cor} 35% 30%)`;
  return {
    escala: `<path d="M64 78q14-5 28 0M108 78q14-5 28 0" fill="none" stroke="hsl(220 25% 14%)" stroke-width="5" stroke-linecap="round"/>`,
    oculos: `<g fill="none" stroke="${escuro}" stroke-width="4"><circle cx="78" cy="96" r="17"/><circle cx="122" cy="96" r="17"/><path d="M95 95q5-4 10 0"/></g>`,
    monoculo: `<circle cx="122" cy="96" r="17" fill="none" stroke="${escuro}" stroke-width="4"/><path d="M138 102q8 18 2 34" fill="none" stroke="${escuro}" stroke-width="2"/>`,
    advisor: `<path d="M64 78q14-7 28-1M108 77q14-6 28 1" fill="none" stroke="hsl(25 35% 20%)" stroke-width="4.5" stroke-linecap="round"/>`,
  }[item] || "";
}

// Desenha o bonequinho (corpo de bala de goma, olhos, bochechas, boca e o detalhe do agente).
function bonecoSvg(nome, id) {
  const { cor, item, sat = 1 } = rostoDe(nome);
  const S = (v) => Math.round(v * sat);
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="g${id}" cx="38%" cy="30%" r="80%">
        <stop offset="0" stop-color="hsl(${cor} ${S(80)}% 96%)"/><stop offset=".55" stop-color="hsl(${cor} ${S(60)}% 84%)"/><stop offset="1" stop-color="hsl(${cor} ${S(45)}% 70%)"/>
      </radialGradient>
    </defs>
    <ellipse class="sombra" cx="100" cy="182" rx="52" ry="8" fill="hsl(${cor} 25% 60% / .22)"/>
    <g class="corpo">
      <path d="M100 32c40 0 66 30 66 72s-24 70-66 70-66-28-66-70 26-72 66-72z" fill="url(#g${id})"/>
      <ellipse cx="78" cy="60" rx="16" ry="9" fill="#fff" opacity=".55" transform="rotate(-25 78 60)"/>
      <g class="rosto-g">
        <g class="olhos">
          <g class="olho" style="transform-origin:78px 96px"><ellipse cx="78" cy="96" rx="7.5" ry="10" fill="hsl(${cor} 40% 18%)"/><circle class="brilho" cx="80.5" cy="92" r="2.6" fill="#fff"/></g>
          <g class="olho" style="transform-origin:122px 96px"><ellipse cx="122" cy="96" rx="7.5" ry="10" fill="hsl(${cor} 40% 18%)"/><circle class="brilho" cx="124.5" cy="92" r="2.6" fill="#fff"/></g>
        </g>
        <ellipse cx="64" cy="118" rx="9" ry="5" fill="hsl(${(cor + 340) % 360} 80% 75% / .55)"/>
        <ellipse cx="136" cy="118" rx="9" ry="5" fill="hsl(${(cor + 340) % 360} 80% 75% / .55)"/>
        <path class="boca" d="M88 124q12 10 24 0" fill="none" stroke="hsl(${cor} 40% 22%)" stroke-width="4" stroke-linecap="round"/>
        ${itemRostoSvg(item, cor)}
      </g>
      ${itemSvg(item, cor)}
    </g>
    <g class="pontos" opacity="0">
      <circle cx="150" cy="40" r="5" fill="hsl(${cor} 45% 60%)"/><circle cx="166" cy="26" r="4" fill="hsl(${cor} 45% 70%)"/><circle cx="178" cy="12" r="3" fill="hsl(${cor} 45% 80%)"/>
    </g>
  </svg>`;
}

/* ================= animação ================= */
// Estados: ocioso (respira e pisca), ouvindo (mexe com a sua voz), pensando (olha em volta), respondeu (pulinho).
const anima = { estado: "ocioso", energia: 0, alvo: 0, t0: performance.now(), pulo: 0, piscar: 0, proximaPiscada: 2000 };
const calmo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function mudarEstado(e) { anima.estado = e; if (e === "respondeu") anima.pulo = 1; }

// Olhar: segue o cursor (ou o dedo) pela tela inteira; o corpo também se inclina um pouco para lá.
const olhar = { x: 0, y: 0, ax: 0, ay: 0 };
function mirar(cx, cy) {
  const b = document.getElementById("boneco");
  if (!b || b.offsetParent === null) return;
  const r = b.getBoundingClientRect();
  const dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height * 0.45);
  const d = Math.hypot(dx, dy) || 1, alcance = Math.min(1, d / (r.width * 0.5));
  olhar.ax = (dx / d) * alcance; olhar.ay = (dy / d) * alcance;
}
window.addEventListener("pointermove", (e) => mirar(e.clientX, e.clientY), { passive: true });
window.addEventListener("pointerdown", (e) => mirar(e.clientX, e.clientY), { passive: true });
document.addEventListener("mouseleave", () => { olhar.ax = 0; olhar.ay = 0; });
function cutucar(forca = 1) { anima.alvo = Math.min(1, anima.alvo + 0.45 * forca); }

function quadro(agora) {
  const svg = document.querySelector("#boneco svg");
  if (svg && !calmo) {
    const t = (agora - anima.t0) / 1000;
    anima.energia += (anima.alvo - anima.energia) * 0.25;
    anima.alvo *= 0.9;
    anima.pulo *= 0.93;
    const e = anima.estado === "ouvindo" ? Math.max(anima.energia, 0.12 + 0.06 * Math.sin(t * 6)) : 0;
    const resp = Math.sin(t * 2.1) * 0.018;
    const sy = 1 + resp + e * 0.08 - anima.pulo * 0.05;
    const sx = 1 - resp * 0.6 + e * 0.05 + anima.pulo * 0.04;
    const dy = -Math.abs(Math.sin(t * 9)) * e * 10 - anima.pulo * 14 * Math.abs(Math.sin(t * 7));
    olhar.x += (olhar.ax - olhar.x) * 0.18; olhar.y += (olhar.ay - olhar.y) * 0.18;
    const segue = anima.estado === "pensando" ? 0 : 1;
    const incl = (anima.estado === "pensando" ? Math.sin(t * 1.6) * 4 : Math.sin(t * 1.1) * 1.2 + e * Math.sin(t * 13) * 3) + olhar.x * 14 * segue;
    svg.querySelector(".corpo").setAttribute("transform", `translate(100 176) rotate(${incl}) scale(${sx} ${sy}) translate(-100 -176) translate(${olhar.x * 16 * segue} ${dy + olhar.y * 8 * segue})`);
    svg.querySelector(".rosto-g").setAttribute("transform", `translate(${olhar.x * 16 * segue} ${olhar.y * 13 * segue})`);
    svg.querySelector(".sombra").setAttribute("transform", `translate(100 182) scale(${1 - Math.min(0.3, -dy / 60)} 1) translate(-100 -182)`);

    // olhos: piscar, e olhar em volta quando está pensando
    if (agora > anima.proximaPiscada) { anima.piscar = 1; anima.proximaPiscada = agora + 2500 + Math.random() * 3000; }
    anima.piscar *= 0.75;
    const fecha = anima.piscar > 0.2 ? 0.1 : 1;
    const ox = anima.estado === "pensando" ? Math.sin(t * 1.3) * 7 : olhar.x * 7;
    const oy = anima.estado === "pensando" ? -4 : olhar.y * 6;
    svg.querySelectorAll(".olho").forEach(o => o.style.transform = `translate(${ox}px, ${oy}px) scaleY(${fecha * (anima.estado === "respondeu" && anima.pulo > 0.3 ? 0.55 : 1)})`);

    // boca: abre com a voz, reta pensando, sorriso no resto
    const boca = svg.querySelector(".boca");
    if (anima.estado === "ouvindo") { const a = 4 + e * 16; boca.setAttribute("d", `M90 ${124 - a / 3}q10 ${a} 20 0q-10 -${a / 2} -20 0z`); boca.setAttribute("fill", "hsl(0 40% 30% / .8)"); }
    else if (anima.estado === "pensando") { boca.setAttribute("d", "M90 126q10 -3 20 0"); boca.setAttribute("fill", "none"); }
    else { boca.setAttribute("d", `M86 122q14 ${12 + anima.pulo * 6} 28 0`); boca.setAttribute("fill", "none"); }

    const pontos = svg.querySelector(".pontos");
    pontos.setAttribute("opacity", anima.estado === "pensando" ? String(0.55 + 0.45 * Math.sin(t * 3)) : "0");
  }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

/* ================= estado e API ================= */
let cfg = { senha: "", base: "", agente: null, conversa: null };
let agentes = [], conversa = null, poll = null, ultimoRespondido = null;
const $ = (id) => document.getElementById(id);
function guardar() { try { localStorage.setItem(LOCAL, JSON.stringify(cfg)); } catch {} }
function lerLocal() { try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem(LOCAL) || "{}") }; } catch {} }
function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const f of filhos) if (f != null) e.append(f);
  return e;
}
const agenteAtual = () => agentes.find(a => a.id === cfg.agente);

async function descobrirEndereco() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/endereco.json?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
  if (!r.ok) throw new Error("Não achei o endereço do Postmaker. O PC está ligado com o Postmaker aberto?");
  return (await r.json()).url.replace(/\/$/, "");
}
async function api(caminho, opcoes = {}, tentouDeNovo = false) {
  if (!cfg.base) cfg.base = await descobrirEndereco();
  let r;
  try {
    r = await fetch(cfg.base + "/api/sala" + caminho, {
      ...opcoes,
      headers: { Accept: "application/json", "X-Senha": cfg.senha, ...(opcoes.json ? { "Content-Type": "application/json" } : {}) },
      body: opcoes.json ? JSON.stringify(opcoes.json) : opcoes.body,
    });
  } catch {
    // O túnel muda de endereço quando o PC reinicia: busca o novo e tenta mais uma vez.
    if (!tentouDeNovo) { cfg.base = ""; return api(caminho, opcoes, true); }
    throw new Error("Não consegui falar com o Postmaker. Confira se o PC está ligado e com internet.");
  }
  const dados = await r.json().catch(() => ({}));
  if (r.status === 401) { sair("Senha errada."); throw new Error("Senha errada."); }
  if (!r.ok) throw new Error(dados.message || "Algo deu errado no Postmaker.");
  return dados;
}

/* ================= entrada ================= */
$("boneco-entrada").innerHTML = bonecoSvg("Sócio de Negócios", "e");
function sair(msg) {
  cfg.senha = ""; guardar();
  $("app").hidden = true; $("tela-entrada").hidden = false;
  $("erro-entrada").textContent = msg || "";
}
$("form-entrada").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  cfg.senha = $("senha").value.trim();
  $("erro-entrada").textContent = "Conectando…";
  try { await iniciar(); } catch (e) { $("erro-entrada").textContent = e.message; }
});

async function iniciar() {
  agentes = await api("/agentes");
  guardar();
  $("tela-entrada").hidden = true; $("app").hidden = false;
  const socio = agentes.find(a => a.nome === "Sócio de Negócios");
  cfg.agente = agentes.some(a => a.id === cfg.agente) ? cfg.agente : (socio || agentes[0])?.id;
  desenharEquipe(); desenharPalco();
  $("pauta").replaceChildren(...PAUTA.map(([rotulo, texto]) => el("button", { type: "button", text: rotulo, onclick: () => enviar(texto) })));
  if (cfg.conversa) await abrirConversa(cfg.conversa).catch(() => novaConversa());
  else render();
  carregarHistorico();
}

function desenharEquipe() {
  $("equipe").replaceChildren(...agentes.map(a => el("button", {
    type: "button", "aria-pressed": String(a.id === cfg.agente), onclick: () => trocarAgente(a.id),
  }, el("span", { class: "rosto", html: bonecoSvg(a.nome, "m" + a.id) }), el("span", { text: a.nome }))));
}
function desenharPalco() {
  const a = agenteAtual();
  $("nome").textContent = a?.nome || "";
  $("funcao").textContent = a?.funcao || "";
  $("boneco").innerHTML = bonecoSvg(a?.nome, "b" + (a?.id ?? 0));
}
function trocarAgente(id) {
  if (gravando) return;
  cfg.agente = id; guardar(); desenharEquipe(); desenharPalco(); novaConversa();
}

/* ================= conversa ================= */
const ocupado = () => conversa?.mensagens?.some(m => m.status === "na fila" || m.status === "pensando");
function markdown(t) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(t));
  const d = document.createElement("div"); d.textContent = t; return `<p style="white-space:pre-wrap">${d.innerHTML}</p>`;
}
function cartaoResposta(texto) {
  const c = el("div", { class: "cartao", html: markdown(texto || "") });
  c.querySelectorAll("table").forEach(t => { const w = el("div", { class: "tabela" }); t.replaceWith(w); w.append(t); });
  c.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  return c;
}

function render() {
  const msgs = conversa?.mensagens || [];
  const ultimaVoce = [...msgs].reverse().find(m => m.autor === "voce");
  const ultimaAgente = [...msgs].reverse().find(m => m.autor === "agente");
  $("pauta").hidden = msgs.length > 0;

  if (!gravando) {
    if (ultimaVoce) mostrarFala(ultimaVoce.texto);
    else if (!msgs.length && !$("fala").textContent.startsWith("Não ouvi")) $("fala").hidden = true;
  }

  const resposta = $("resposta");
  if (!ultimaAgente) resposta.replaceChildren();
  else if (ultimaAgente.status === "na fila" || ultimaAgente.status === "pensando") {
    resposta.replaceChildren(el("p", { class: "pensando", text: ultimaAgente.status === "na fila" ? "Na fila…" : ((ultimaAgente.atividade || []).slice(-1)[0] || "Pensando…") }));
  } else if (ultimaAgente.status === "falhou") {
    resposta.replaceChildren(el("p", { class: "erro", text: ultimaAgente.erro || "Não consegui responder desta vez." }));
  } else {
    resposta.replaceChildren(cartaoResposta(ultimaAgente.texto));
  }

  if (!gravando) {
    if (ocupado()) { mudarEstado("pensando"); $("estado").textContent = "Estou pensando…"; }
    else if (anima.estado === "pensando") mudarEstado("respondeu");
    if (!ocupado()) $("estado").textContent = msgs.length ? "Toque em mim para responder" : "Toque em mim para falar";
  }

  // Conversa inteira, para quando a resposta de agora não basta.
  const anteriores = msgs.slice(0, -2);
  $("bloco-fio").hidden = anteriores.length === 0;
  $("fio").replaceChildren(...anteriores.map(m => m.autor === "voce"
    ? el("div", { class: "voce", text: m.texto })
    : el("div", {}, el("p", { class: "quem", text: agenteAtual()?.nome || "Agente" }), m.status === "pronta" ? cartaoResposta(m.texto) : el("p", { class: "dica", text: m.erro || "" }))));
}

async function enviar(texto) {
  texto = (texto || "").trim();
  if (!texto) return false;
  if (ocupado()) { $("estado").textContent = "Espere eu terminar de responder para mandar a próxima."; return false; }
  try {
    conversa = await api("/mensagens", { method: "POST", json: { texto, agente_id: cfg.agente, conversa_id: conversa?.id ?? null } });
    cfg.conversa = conversa.id; guardar(); render(); seguirSePensando(); carregarHistorico();
    return true;
  } catch (e) { $("estado").textContent = e.message; return false; }
}
function pararPoll() { clearTimeout(poll); poll = null; }
function seguirSePensando() {
  pararPoll();
  if (!ocupado()) return;
  poll = setTimeout(async () => {
    try { const c = await api(`/conversas/${conversa.id}`); if (c.id === conversa?.id) { conversa = c; render(); } } catch {}
    seguirSePensando();
  }, 3000);
}
function novaConversa() { conversa = null; cfg.conversa = null; guardar(); pararPoll(); mudarEstado("ocioso"); render(); }
async function abrirConversa(id) {
  conversa = await api(`/conversas/${id}`);
  cfg.conversa = conversa.id;
  if (conversa.agente_id !== cfg.agente) { cfg.agente = conversa.agente_id; desenharEquipe(); desenharPalco(); }
  guardar(); render(); seguirSePensando();
}
async function carregarHistorico() {
  try {
    const lista = await api("/conversas");
    $("lista-conversas").replaceChildren(...lista.map(c => el("li", {}, el("button", { type: "button", onclick: () => { $("historico").open = false; abrirConversa(c.id); window.scrollTo({ top: 0 }); } },
      el("span", { text: c.titulo || "Sem título" }), el("small", { text: `${c.agente} · ${new Date(c.quando).toLocaleDateString("pt-BR", { day: "numeric", month: "short" })}` })))));
  } catch {}
}
$("nova").addEventListener("click", novaConversa);

/* ================= falar ================= */
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let gravando = false, rec = null, desligando = false, finalTxt = "", gravador = null, pedacos = [], medidor = null;

function marcarGravando(sim) {
  gravando = sim;
  mudarEstado(sim ? "ouvindo" : (ocupado() ? "pensando" : "ocioso"));
  $("boneco").setAttribute("aria-label", sim ? "Parar e enviar" : "Tocar para falar");
  $("estado").innerHTML = sim ? "<b>●</b> Ouvindo… toque em mim de novo para enviar" : "Toque em mim para falar";
}
// O que você está falando aparece logo embaixo do bonequinho, para saber que ele está ouvindo.
function mostrarFala(final, parcial = "", aviso = "") {
  const f = $("fala");
  f.hidden = false;
  f.classList.toggle("ouvindo", gravando);
  if (!final && !parcial) { f.replaceChildren(el("i", { text: aviso || (gravando ? "Estou ouvindo… pode falar." : "") })); return; }
  f.replaceChildren(el("b", { text: final }), parcial ? el("i", { text: (final ? " " : "") + parcial }) : "");
}

$("boneco").addEventListener("click", () => {
  const ditado = Reconhecimento && cfg.modo !== "gravador";
  if (gravando) return gravador && gravador.state === "recording" ? pararGravador() : pararDitado();
  if (ocupado()) { cutucar(0.6); $("estado").textContent = "Ainda estou pensando na anterior. Já te respondo."; return; }
  return ditado ? comecarDitado() : comecarGravador();
});

async function aoTerminarDeFalar(texto) {
  texto = texto.trim();
  if (!texto) { mostrarFala("", "", "Não ouvi nada. Toque em mim e fale de novo."); $("estado").textContent = "Toque em mim para falar"; return; }
  mostrarFala(texto);
  $("estado").textContent = "Enviando…";
  if (!(await enviar(texto))) abrirTeclado(texto);
}

// Chrome: o texto aparece enquanto você fala, e cada pedaço de fala faz o bonequinho mexer.
// Se o ditado do navegador não funcionar neste aparelho (erro ou microfone que nunca abre), troca sozinho para
// gravar o áudio e transcrever no PC, e lembra disso nas próximas vezes.
let ultimoParcial = "", vigia = null;
function trocarParaGravador(motivo) {
  desligando = true; clearTimeout(vigia);
  try { rec.abort(); } catch {}
  cfg.modo = "gravador"; guardar();
  marcarGravando(false);
  $("estado").textContent = motivo + " Vou gravar o áudio e transcrever no PC. Toque em mim e fale de novo.";
}
function comecarDitado() {
  finalTxt = ""; ultimoParcial = ""; desligando = false;
  rec = new Reconhecimento();
  rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  let ouviuAlgo = false;
  rec.onaudiostart = () => { ouviuAlgo = true; };
  rec.onresult = (ev) => {
    let parcial = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalTxt += (finalTxt ? " " : "") + t.trim(); else parcial += t;
    }
    ultimoParcial = parcial.trim();
    cutucar();
    mostrarFala(finalTxt, parcial);
  };
  rec.onspeechstart = () => cutucar();
  rec.onerror = (ev) => {
    if (ev.error === "no-speech" || ev.error === "aborted") return;
    if (ev.error === "not-allowed") { desligando = true; $("estado").textContent = "O navegador bloqueou o microfone. Libere o microfone para este site nas configurações do navegador."; return; }
    if (ev.error === "audio-capture") { desligando = true; $("estado").textContent = "Não achei um microfone neste aparelho."; return; }
    trocarParaGravador("O ditado deste navegador não funcionou.");
  };
  rec.onend = () => {
    if (cfg.modo === "gravador") return;
    if (!desligando) { try { rec.start(); return; } catch {} }
    clearTimeout(vigia);
    marcarGravando(false);
    aoTerminarDeFalar(finalTxt || ultimoParcial);
  };
  try {
    rec.start(); marcarGravando(true); mostrarFala("");
    vigia = setTimeout(() => { if (!ouviuAlgo && gravando) trocarParaGravador("O microfone não abriu no ditado deste navegador."); }, 4000);
  } catch { trocarParaGravador("Não consegui ligar o ditado."); }
}
function pararDitado() { desligando = true; try { rec.stop(); } catch {} }

// Sem ditado no navegador (ex.: iPhone): grava, mexe com o volume da voz, e o Whisper do PC transcreve.
async function comecarGravador() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const an = ctx.createAnalyser(); an.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      medidor = setInterval(() => {
        an.getByteTimeDomainData(buf);
        let s = 0; for (const v of buf) s += (v - 128) ** 2;
        const nivel = Math.sqrt(s / buf.length) / 40;
        if (nivel > 0.08) cutucar(Math.min(1, nivel));
      }, 80);
      medidor.ctx = ctx;
    } catch {}
    pedacos = [];
    gravador = new MediaRecorder(stream);
    gravador.ondataavailable = (e) => e.data.size && pedacos.push(e.data);
    gravador.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (medidor) { clearInterval(medidor); try { medidor.ctx.close(); } catch {} medidor = null; }
      marcarGravando(false);
      mudarEstado("pensando");
      $("estado").textContent = "Entendendo o que você disse…";
      try {
        const fd = new FormData();
        fd.append("audio", new Blob(pedacos, { type: gravador.mimeType }), "fala");
        const { texto } = await api("/transcrever", { method: "POST", body: fd });
        mostrarFala(texto);
        await aoTerminarDeFalar(texto);
      } catch (e) { mudarEstado("ocioso"); $("estado").textContent = e.message; }
    };
    gravador.start();
    marcarGravando(true);
    mostrarFala("");
  } catch { $("estado").textContent = "O navegador bloqueou o microfone. Libere o microfone para este site."; }
}
function pararGravador() { try { gravador.stop(); } catch {} }

/* ================= escrever e plano ================= */
function abrirTeclado(texto) { $("teclado").hidden = false; if (texto) $("texto").value = texto; $("texto").focus(); }
$("btn-teclado").addEventListener("click", () => { $("teclado").hidden ? abrirTeclado() : ($("teclado").hidden = true); });
$("enviar-texto").addEventListener("click", async () => { if (await enviar($("texto").value)) { $("texto").value = ""; $("teclado").hidden = true; } });
$("btn-plano").addEventListener("click", () => enviar(FECHAR));

/* ================= começo ================= */
lerLocal();
// Com a senha guardada, um erro de conexão (PC desligado) não apaga a senha: só mostra o aviso.
if (cfg.senha) iniciar().catch(e => { $("tela-entrada").hidden = false; $("senha").value = cfg.senha; $("erro-entrada").textContent = e.message; });
else sair();
</script>
</body>
